# Add under the agent's launch profile. Plants our hooks as a WORKSPACE plugin in the boot dir
# (agy discovers <cwd>/.agents/plugins/<name>/ and enables it by default; verified, agy 1.3.3).
# `source:` is assumed to be a path copied to rel_path (field semantics not verified here).
# Needs TETHER_AGENT_URN in agy's environment; add TETHER_MAIL_AGY_REGISTER=1 only for the opt-in.
injection:
  native_files:
    - {rel_path: .agents/plugins/tether-mail/plugin.json,         source: <tether-mail>/agy/planted/.agents/plugins/tether-mail/plugin.json}
    - {rel_path: .agents/plugins/tether-mail/hooks.json,          source: <tether-mail>/agy/planted/.agents/plugins/tether-mail/hooks.json}
    - {rel_path: .agents/plugins/tether-mail/hooks/mail-hook.py,  source: <tether-mail>/agy/planted/.agents/plugins/tether-mail/hooks/mail-hook.py, mode: 0755}
    - {rel_path: .agents/plugins/tether-mail/lib/tmail.py,        source: <tether-mail>/agy/planted/.agents/plugins/tether-mail/lib/tmail.py}
    - {rel_path: .agents/plugins/tether-mail/bin/tether-mail-agy-relay,    source: <tether-mail>/agy/planted/.agents/plugins/tether-mail/bin/tether-mail-agy-relay, mode: 0755}
    - {rel_path: .agents/plugins/tether-mail/bin/tether-mail-agy-register, source: <tether-mail>/agy/planted/.agents/plugins/tether-mail/bin/tether-mail-agy-register, mode: 0755}
    - {rel_path: .agents/plugins/tether-mail/bin/tether-mail-watch,        source: <tether-mail>/agy/planted/.agents/plugins/tether-mail/bin/tether-mail-watch, mode: 0755}
